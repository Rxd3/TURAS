name: Acoustic and RDL offline tests
on:
  pull_request:
  push:
    branches: ['feat/m4-*', 'feat/m5-*']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/adaptation-test.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests -q
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
